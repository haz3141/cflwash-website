name: Hub page QA latest

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PUBLIC_TURNSTILE_SITE_KEY: test-site-key
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format working copy
        run: pnpm format
      - name: List formatter changes
        run: git diff --name-only
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm audit:patterns
      - run: pnpm audit:site
      - run: git diff --check
      - name: Upload formatted files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatted-hub-page-files
          path: |
            src/pages/services.astro
            src/pages/service-areas.astro
            src/components/site/Header.astro
            src/components/site/Footer.astro
            src/components/site/Breadcrumbs.astro
            src/components/site/BreadcrumbSchema.astro
            docs/design/IMAGE_AUDIT.md
            docs/product/PAGE_INVENTORY.md
          if-no-files-found: error
