name: Hub page QA latest

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PUBLIC_TURNSTILE_SITE_KEY: test-site-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/service-area-page-redesign
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format working copy
        run: pnpm format
      - name: Commit formatter output
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: 'style: format hub pages and audit docs [skip ci]'
          file_pattern: 'src/pages/services.astro src/pages/service-areas.astro src/components/site/Header.astro src/components/site/Footer.astro src/components/site/Breadcrumbs.astro src/components/site/BreadcrumbSchema.astro docs/design/IMAGE_AUDIT.md docs/product/PAGE_INVENTORY.md'
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm audit:patterns
      - run: pnpm audit:site
      - run: git diff --check origin/dev...HEAD
