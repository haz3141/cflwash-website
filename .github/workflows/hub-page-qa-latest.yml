name: Hub page QA latest

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PUBLIC_TURNSTILE_SITE_KEY: test-site-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/service-area-page-redesign
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add homepage hub links
        run: python scripts/add-homepage-hub-links.py
      - run: pnpm format
      - name: Commit homepage hub links
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: 'feat(navigation): link homepage sections to hubs [skip ci]'
          file_pattern: 'src/pages/index.astro'
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm audit:patterns
      - run: pnpm audit:site
      - run: git diff --check origin/dev...HEAD
