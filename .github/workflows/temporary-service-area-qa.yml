name: Temporary service-area QA

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_TURNSTILE_SITE_KEY: test-site-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format working copy
        run: pnpm format
      - name: Capture formatting patch
        run: git diff -- . ':!.github/workflows/temporary-service-area-qa.yml' > /tmp/format.patch
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Pattern audit
        run: pnpm audit:patterns
      - name: Site audit
        run: pnpm audit:site
      - name: Whitespace
        run: git diff --check
      - name: Upload formatting patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-area-format-patch
          path: /tmp/format.patch
          if-no-files-found: error
      - name: Upload formatted data file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatted-service-area-pages
          path: src/data/serviceAreaPages.ts
          if-no-files-found: error
