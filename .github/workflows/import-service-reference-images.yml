name: Import service reference images

on:
  push:
    branches:
      - feat/service-area-page-redesign

permissions:
  contents: write

jobs:
  import-images:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/service-area-page-redesign
          fetch-depth: 0

      - name: Reassemble image archive
        run: |
          cat .tmp/service-photo-import/part-*.txt > /tmp/service-photo-import.b64
          base64 --decode /tmp/service-photo-import.b64 > /tmp/service-photo-import.zip
          echo "a3937ecdb7edc9525a160f885e03966b181833ceab28668f83baf2e3c8038e84  /tmp/service-photo-import.zip" | sha256sum --check

      - name: Import web-ready images
        run: |
          unzip -o /tmp/service-photo-import.zip -d .
          rm -rf .tmp/service-photo-import

      - name: Commit imported images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/services/reference .tmp/service-photo-import
          git commit -m "feat(images): import service reference collages [skip ci]"
          git push origin HEAD:feat/service-area-page-redesign
